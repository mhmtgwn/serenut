name: Publish Ready Catalog

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag containing Katalog.zip
        required: true
        default: ready-catalog-v1

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download catalog release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download '${{ inputs.release_tag }}' \
            --repo '${{ github.repository }}' \
            --pattern 'Katalog.zip' \
            --dir catalog-upload
          test -s catalog-upload/Katalog.zip
          sha256sum catalog-upload/Katalog.zip | tee catalog-upload/Katalog.zip.sha256

      - name: Upload catalog to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          key="$RUNNER_TEMP/catalog-vps-key"
          printf '%s\n' "$VPS_SSH_KEY" > "$key"
          chmod 600 "$key"
          remote="$VPS_USER@$VPS_HOST"
          ssh -i "$key" -p "$VPS_PORT" -o StrictHostKeyChecking=accept-new "$remote" \
            'mkdir -p /var/www/serenut/server/catalogs /var/www/serenut/server/catalogs/.incoming'
          scp -i "$key" -P "$VPS_PORT" catalog-upload/Katalog.zip \
            "$remote:/var/www/serenut/server/catalogs/.incoming/Katalog.zip"
          scp -i "$key" -P "$VPS_PORT" catalog-upload/Katalog.zip.sha256 \
            "$remote:/var/www/serenut/server/catalogs/.incoming/Katalog.zip.sha256"
          ssh -i "$key" -p "$VPS_PORT" "$remote" \
            'mv /var/www/serenut/server/catalogs/.incoming/Katalog.zip /var/www/serenut/server/catalogs/Katalog.zip && mv /var/www/serenut/server/catalogs/.incoming/Katalog.zip.sha256 /var/www/serenut/server/catalogs/Katalog.zip.sha256 && ls -lh /var/www/serenut/server/catalogs/Katalog.zip'

      - name: Verify catalog endpoint
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error https://api.serenut.com/api/v1/catalogs/ready | grep -q '"available":true'; then
              exit 0
            fi
            sleep 10
          done
          exit 1
