name: Serenut CI and Deployment

on:
  workflow_dispatch:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: serenut-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-key-continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prevent incompatible release signer rotation
        run: |
          node scripts/verify_release_key_continuity.js HEAD^
          node --check scripts/verify_published_release.js
          node scripts/test_verify_published_release.js
          node scripts/test_release_pipeline_isolation.js

  backend-ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: npm run test:release-signing
        working-directory: server
      - name: Create isolated acceptance database
        env:
          PGPASSWORD: postgrespassword
        run: psql -h localhost -p 5433 -U postgres -d postgres -c "CREATE DATABASE serenut_test;"
      - name: Run migrations and tests
        working-directory: server
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5433/postgres
          TEST_DATABASE_URL: postgres://postgres:postgrespassword@localhost:5433/serenut_test
          JWT_SECRET: testing-jwt-secret-key-that-is-at-least-32-chars-long
          APP_SECRET: testing-app-secret-key-that-is-at-least-32-bytes-long
          INVOICES_DIR: ./invoices
        run: |
          rm -f .env.test
          DATABASE_URL="$TEST_DATABASE_URL" npm run migrate
          npm run test

  flutter-ci:
    # GitHub-hosted Ubuntu jobs can remain unassigned and get cancelled after
    # the queue timeout. Android's toolchain is fully supported on Windows,
    # whose runner is already required and available for this release pipeline.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run release-critical Flutter tests
        run: >-
          flutter test --fail-fast
          test/services/release_manager_test.dart
          test/services/payment_fsm_test.dart
          test/services/payment_terminal_orchestrator_test.dart
          test/services/scale_session_test.dart
          test/services/printer_discovery_service_test.dart
          test/services/weighed_product_flow_test.dart
          test/services/connection_manager_test.dart
          test/services/portal_repository_test.dart

      - name: Configure Android signing
        id: android-signing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Android signing secrets are not configured; release artifact build is skipped."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/serenut-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=serenut-release.jks\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
      - name: Prepare compact Android release verification defines
        if: github.event_name != 'pull_request' && steps.android-signing.outputs.configured == 'true'
        shell: powershell
        run: |
          $keys = Get-Content config/signing_public_keys.json -Raw | ConvertFrom-Json
          @{
            LICENSE_RSA_MODULUS = [string]$keys.LICENSE_RSA_MODULUS
            RELEASE_RSA_MODULI = [string]$keys.RELEASE_RSA_MODULI
          } | ConvertTo-Json -Compress | Set-Content .release-dart-defines.json -Encoding utf8
      - name: Build signed Android release with public verification keys
        run: >-
          flutter build apk --release
          --dart-define-from-file=.release-dart-defines.json
        if: github.event_name != 'pull_request' && steps.android-signing.outputs.configured == 'true'
      - name: Verify production Android signing certificate
        if: github.event_name != 'pull_request' && steps.android-signing.outputs.configured == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_CERT_SHA256: 3806945a82a023a36a91ddcce3ff350d3695da41503b254452375313bd221493
        run: |
          actual_cert_sha256="$(
            keytool -exportcert -rfc \
              -keystore android/app/serenut-release.jks \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2 |
            tr -d ':' |
            tr '[:upper:]' '[:lower:]'
          )"
          if [ "$actual_cert_sha256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Android release certificate mismatch: $actual_cert_sha256"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && steps.android-signing.outputs.configured == 'true'
        with:
          name: serenut-os-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  flutter-full-test:
    name: Flutter full suite (shard ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run complete Flutter test shard
        run: flutter test --concurrency=4 --total-shards=4 --shard-index=${{ matrix.shard }}

  windows-ci:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows release with public verification keys
        shell: powershell
        run: |
          $keys = Get-Content config/signing_public_keys.json -Raw | ConvertFrom-Json
          @{
            LICENSE_RSA_MODULUS = [string]$keys.LICENSE_RSA_MODULUS
            RELEASE_RSA_MODULI = [string]$keys.RELEASE_RSA_MODULI
          } | ConvertTo-Json -Compress | Set-Content .release-dart-defines.json -Encoding utf8
          flutter build windows --release --dart-define-from-file=.release-dart-defines.json
      - name: Configure and sign Windows application binaries
        id: windows-signing
        shell: powershell
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) {
            "configured=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Warning "Windows Authenticode certificate is not configured; binaries remain unsigned."
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "serenut-code-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object FullName -Match '\\x64\\signtool\.exe$' |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          Get-ChildItem build\windows\x64\runner\Release -Recurse -Include *.exe,*.dll | ForEach-Object {
            & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfxPath /p $env:WINDOWS_SIGNING_PFX_PASSWORD $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed: $($_.FullName)" }
            & $signtool verify /pa /all $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed: $($_.FullName)" }
          }
          "configured=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Bundle Microsoft Visual C++ runtime
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path windows/installer/redist | Out-Null
          Invoke-WebRequest -Uri https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile windows/installer/redist/vc_redist.x64.exe
      - name: Build Windows Installer with Inno Setup
        shell: powershell
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 7\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 7\ISCC.exe" windows\installer\serenut_installer.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer\serenut_installer.iss
          } else {
            iscc windows\installer\serenut_installer.iss
          }
      - name: Sign and verify Windows installer
        if: steps.windows-signing.outputs.configured == 'true'
        shell: powershell
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "serenut-code-signing.pfx"
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object FullName -Match '\\x64\\signtool\.exe$' |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          $installer = "build\windows\installer\SerenutOSSetup.exe"
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfxPath /p $env:WINDOWS_SIGNING_PFX_PASSWORD $installer
          if ($LASTEXITCODE -ne 0) { throw "Installer signing failed" }
          & $signtool verify /pa /all $installer
          if ($LASTEXITCODE -ne 0) { throw "Installer signature verification failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: serenut-os-windows-installer
          path: build/windows/installer/SerenutOSSetup.exe

  deploy-production:
    # Backend changes are independently verified and deployed by
    # sync-hotfix.yml. Do not block signed client releases when GitHub cannot
    # allocate an Ubuntu runner for the duplicate backend gate.
    needs: [release-key-continuity, backend-ci, flutter-ci, flutter-full-test, windows-ci]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Read application release version
        id: release-version
        shell: bash
        run: |
          version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: serenut-os-android-apk
          path: release-artifacts/android
      - uses: actions/download-artifact@v4
        with:
          name: serenut-os-windows-installer
          path: release-artifacts/windows
      - name: Upload release files to production
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: release-artifacts/*
          # Never share an incoming directory across workflow runs. A cancelled
          # SSH deployment may continue briefly after a newer main run starts.
          target: /var/www/serenut/server/releases/_incoming/${{ steps.release-version.outputs.value }}
          strip_components: 1
      - name: Deploy production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            cd /var/www/serenut
            if [ ! -d .git ]; then
              git init
              git remote add origin https://github.com/mhmtgwn/serenut.git
            fi
            # Deploy the exact commit that produced the downloaded artifacts;
            # main may advance while this remote SSH command is still running.
            git fetch origin main
            git cat-file -e '${{ github.sha }}^{commit}'
            git reset --hard '${{ github.sha }}'
            sh server/scripts/deploy_production_ci.sh '${{ steps.release-version.outputs.value }}'

  deploy-staging:
    needs: [release-key-continuity, backend-ci, flutter-ci, flutter-full-test, windows-ci]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy staging
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: sudo bash /var/www/serenut-staging/server/scripts/deploy_staging.sh
