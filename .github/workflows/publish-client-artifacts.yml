name: Publish Prepared Client Artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Artifacts'i üreten başarılı GitHub Actions run kimliği"
        required: true
        type: string
      version:
        description: "pubspec ile aynı tam sürüm (ör. 1.3.10+90)"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: serenut-os-android-apk
          path: release-artifacts/android
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: serenut-os-windows-installer
          path: release-artifacts/windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}
      - name: Validate requested version
        shell: bash
        run: |
          [[ '${{ inputs.version }}' =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]] || {
            echo "::error::version must look like 1.3.10+90"
            exit 1
          }
      - name: Resolve successful source run commit
        id: source-run
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            const runId = Number(process.env.SOURCE_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed('run_id must be a positive GitHub Actions run id');
              return;
            }
            const { data } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            if (data.conclusion !== 'success') {
              core.setFailed(`source run ${runId} is not successful`);
              return;
            }
            core.setOutput('head_sha', data.head_sha);
      - name: Upload and publish requested version
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          key="$RUNNER_TEMP/serenut_vps_key"
          printf '%s\n' "$VPS_SSH_KEY" > "$key"
          chmod 600 "$key"
          remote="$VPS_USER@$VPS_HOST"
          incoming="/var/www/serenut/server/releases/_incoming/${{ inputs.version }}"
          ssh -i "$key" -p "$VPS_PORT" -o StrictHostKeyChecking=accept-new "$remote" \
            "mkdir -p '$incoming/android' '$incoming/windows'"
          scp -i "$key" -P "$VPS_PORT" release-artifacts/android/app-release.apk \
            "$remote:$incoming/android/app-release.apk"
          scp -i "$key" -P "$VPS_PORT" release-artifacts/windows/SerenutOSSetup.exe \
            "$remote:$incoming/windows/SerenutOSSetup.exe"
          ssh -i "$key" -p "$VPS_PORT" "$remote" \
            "cd /var/www/serenut && git fetch origin main && git cat-file -e '${{ steps.source-run.outputs.head_sha }}^{commit}' && git reset --hard '${{ steps.source-run.outputs.head_sha }}' && sh server/scripts/deploy_production_ci.sh '${{ inputs.version }}'"
