server {
    listen 80;
    listen [::]:80;
    server_name nutopiano.com www.nutopiano.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nutopiano.com www.nutopiano.com;

    ssl_certificate     /etc/letsencrypt/live/nutopiano.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nutopiano.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/nutopiano;
    index index.html;

    # Güvenlik başlıkları
    add_header X-Frame-Options       "SAMEORIGIN"           always;
    add_header X-Content-Type-Options "nosniff"             always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript text/xml image/svg+xml;

    # Temiz URL desteği: /degirmen → degirmen.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Statik varlıklar için uzun önbellek
    location ~* \.(css|js|woff|woff2|ttf|jpg|jpeg|png|gif|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Gizli dosyalara erişimi engelle
    location ~ /\. { deny all; }
}
