# Canonical Serenut production reverse-proxy configuration.
# Public pages, authentication routes, application routes and API routes are
# all resolved by Express so URL behavior has a single source of truth.

server {
    listen 80;
    listen [::]:80;
    server_name serenut.com www.serenut.com api.serenut.com;
    client_max_body_size 160M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name serenut.com www.serenut.com api.serenut.com;
    client_max_body_size 160M;

    ssl_certificate /etc/letsencrypt/live/serenut.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/serenut.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Instantly drop malicious PHP/eval-stdin bot probes at proxy edge
    location ~* \.(php|aspx?|jsp|cgi)$ {
        return 444;
    }
    location ~* (phpunit|eval-stdin|invokefunction|pearcmd) {
        return 444;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
