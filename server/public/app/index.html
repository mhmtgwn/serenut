<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serenut OS | Yönetim Paneli</title>
  <link rel="icon" href="/favicon.ico?v=20260730-icon4" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=20260730-icon4">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260730-icon4">
  <link rel="manifest" href="/site.webmanifest?v=20260730-icon4">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/css/tokens.css">
  <link rel="stylesheet" href="/shared/css/base.css">
  <link rel="stylesheet" href="/shared/css/components.css">
  <link rel="stylesheet" href="/shared/css/utilities.css">
  <link rel="stylesheet" href="/app/css/app.css?v=20260730-sidebar-logo1">
  <link rel="stylesheet" href="/app/css/theme.css?v=20260730-sidebar-logo2">
</head>
<body class="app-booting">
  <div class="boot-state" id="boot-state" role="status" aria-live="polite">
    <div class="boot-state-mark" aria-hidden="true"></div>
    <strong id="boot-state-title">Çalışma alanınız hazırlanıyor</strong>
    <p id="boot-state-copy">Hesabınız ve yetkileriniz güvenli biçimde yükleniyor.</p>
    <button class="btn btn-primary app-hidden" id="boot-retry" type="button">Tekrar Dene</button>
  </div>
  <div id="shell-view" class="shell-layout">
    <aside class="shell-sidebar">
      <div class="sidebar-top">
        <a href="/" class="sidebar-brand">Serenut OS</a>
        <div class="sidebar-tenant" id="tenant-name">Firma</div>
      </div>
      <nav id="app-nav" class="sidebar-nav"></nav>
      <div class="sidebar-bottom">
        <div class="sidebar-user-name" id="user-name">Kullanıcı</div>
        <div class="sidebar-user-role" id="user-roles">roller</div>
        <button class="btn btn-secondary w-full" id="btn-logout">Çıkış Yap</button>
      </div>
    </aside>

    <main class="shell-main">
      <header class="shell-header">
        <button class="menu-toggle app-menu-toggle" id="sidebar-toggle" type="button" aria-label="Uygulama menüsünü aç">Menü</button>
        <div>
          <div class="auth-eyebrow">Serenut Panel</div>
          <h1 class="shell-title">Çalışma Alanı</h1>
          <p class="shell-copy" id="shell-subtitle">Rolünüze göre modüller hazırlanıyor.</p>
        </div>
        <button class="btn btn-secondary btn-sm" id="btn-home">Ana Görünüm</button>
      </header>

      <section class="overview-grid" id="overview-grid">
        <article class="card">
          <h2 class="panel-title">Rol Özeti</h2>
          <div class="chip-row" id="role-chips"></div>
          <p class="panel-copy" id="workspace-note"></p>
        </article>
        <article class="card">
          <h2 class="panel-title">Şirket Bağlamı</h2>
          <div class="company-meta" id="company-meta"></div>
        </article>
      </section>

      <section class="card module-panel" id="module-panel">
        <div class="module-panel-head">
          <div>
            <h2 class="panel-title">Modüller</h2>
            <p class="panel-copy">Yetkinize göre açılan modüller.</p>
          </div>
        </div>
        <div class="module-grid" id="module-grid"></div>
      </section>

      <section class="card embed-panel app-hidden" id="embed-panel">
        <div class="module-panel-head">
          <div>
            <h2 class="panel-title" id="embed-title">Modül</h2>
            <p class="panel-copy" id="embed-description"></p>
          </div>
        </div>
        <div class="embed-content" id="embed-content"></div>
      </section>
    </main>
  </div>

  <script type="module" src="/app/js/app.js?v=20260730-panel-flow5"></script>
</body>
</html>
