<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Şifremi Unuttum | Serenut</title>
  <link rel="icon" href="/favicon.ico?v=20260730-icon4" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=20260730-icon4"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260730-icon4">
  <link rel="stylesheet" href="/shared/css/tokens.css"><link rel="stylesheet" href="/shared/css/base.css"><link rel="stylesheet" href="/shared/css/components.css"><link rel="stylesheet" href="/shared/css/utilities.css">
  <link rel="stylesheet" href="/app/css/app.css?v=20260729-brand-lockup2">
</head>
<body data-auth-page="forgot-password" class="simple-auth">
  <main class="simple-auth-page">
    <section class="simple-auth-card" aria-labelledby="auth-title">
      <a href="/" class="simple-auth-brand"><img src="/shared/assets/serenut-os-color.svg" alt="Serenut OS"></a>
      <div class="simple-auth-heading"><h1 id="auth-title">Şifremi unuttum</h1><p>Kayıt bilgilerinizi ve tek kullanımlık kurtarma kodunuzu doğrulayın.</p></div>
      <form id="forgot-form">
        <label class="simple-field" for="identifier"><span>E-posta veya kullanıcı adı</span><input id="identifier" required autocomplete="username" autofocus></label>
        <label class="simple-field" for="company-name"><span>Firma ünvanı</span><input id="company-name" required autocomplete="organization"></label>
        <label class="simple-field" for="tax-number"><span>TC veya VKN</span><input id="tax-number" required inputmode="numeric" maxlength="11"></label>
        <label class="simple-field" for="recovery-code"><span>Kurtarma kodu</span><input id="recovery-code" required autocomplete="one-time-code" placeholder="SRNT-XXXX-XXXX-XXXX-XXXX"></label>
        <div class="auth-status text-sm" id="status" role="status"></div>
        <button class="btn btn-primary w-full" type="submit">Doğrula ve Devam Et</button>
      </form>
      <details class="simple-auth-switch">
        <summary>Yönetici destekli kurtarma kodum var</summary>
        <form id="recovery-claim-form">
          <label class="simple-field" for="request-id"><span>Talep numarası</span><input id="request-id" required></label>
          <label class="simple-field" for="claim-code"><span>Tek kullanımlık kod</span><input id="claim-code" required autocomplete="one-time-code"></label>
          <button class="btn btn-secondary w-full" type="submit">Kodu Doğrula</button>
        </form>
      </details>
      <p class="simple-auth-switch"><a href="/login">Girişe dön</a></p>
    </section>
  </main>
  <script type="module" src="/auth/auth.js?v=20260804-recovery1"></script>
</body>
</html>
