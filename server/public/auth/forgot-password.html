<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Şifremi Unuttum | Serenut</title>
  <link rel="icon" href="/favicon.ico?v=20260729-icon2" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=20260729-icon2"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260729-icon2">
  <link rel="stylesheet" href="/shared/css/tokens.css"><link rel="stylesheet" href="/shared/css/base.css"><link rel="stylesheet" href="/shared/css/components.css"><link rel="stylesheet" href="/shared/css/utilities.css">
  <link rel="stylesheet" href="/app/css/app.css?v=20260729-brand-lockup2">
</head>
<body data-auth-page="forgot-password" class="simple-auth">
  <main class="simple-auth-page">
    <section class="simple-auth-card" aria-labelledby="auth-title">
      <a href="/" class="simple-auth-brand"><img src="/shared/assets/serenut-os-color.svg" alt="Serenut OS"></a>
      <div class="simple-auth-heading"><h1 id="auth-title">Şifremi unuttum</h1><p>Sıfırlama bağlantısı göndereceğimiz e-postayı girin.</p></div>
      <form id="forgot-form"><label class="simple-field" for="email"><span>E-posta</span><input type="email" id="email" required autocomplete="email" autofocus></label><div class="auth-status text-sm" id="status" role="status"></div><button class="btn btn-primary w-full" type="submit">Bağlantı Gönder</button></form>
      <p class="simple-auth-switch"><a href="/login">Girişe dön</a></p>
    </section>
  </main>
  <script type="module" src="/auth/auth.js?v=20260729-simple-auth2"></script>
</body>
</html>
