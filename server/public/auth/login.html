<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Giriş Yap | Serenut</title>
  <link rel="stylesheet" href="/shared/css/tokens.css"><link rel="stylesheet" href="/shared/css/base.css"><link rel="stylesheet" href="/shared/css/components.css"><link rel="stylesheet" href="/shared/css/utilities.css">
  <link rel="stylesheet" href="/app/css/app.css?v=20260729-brand-lockup1">
</head>
<body data-auth-page="login">
  <main class="auth-layout">
    <section class="auth-hero"><div class="auth-hero-inner"><a href="/" class="hero-brand">Serenut OS</a><h1 class="hero-title">İşletmeniz burada başlar.</h1><p class="hero-copy">Firmanızı, ekibinizi, cihazlarınızı ve aboneliğinizi tek panelden yönetin.</p></div></section>
    <section class="auth-card-wrap"><div class="auth-card card">
      <div class="auth-card-head"><div><div class="auth-eyebrow">Giriş</div><h1 class="auth-heading">Hesabınıza giriş yapın</h1></div><a class="ghost-link" href="/register">Kayıt Ol</a></div>
      <form id="login-form">
        <div class="form-group"><label class="form-label" for="email">E-posta</label><input type="email" id="email" required autocomplete="email"></div>
        <div class="form-group"><label class="form-label" for="password">Şifre</label><input type="password" id="password" required autocomplete="current-password"></div>
        <div class="auth-row"><a class="ghost-link" href="/forgot-password">Şifremi unuttum</a></div>
        <div class="auth-status text-sm text-red" id="status" role="status"></div>
        <button class="btn btn-primary w-full" type="submit">Giriş Yap</button>
      </form>
    </div></section>
  </main>
  <script type="module" src="/auth/auth.js?v=20260729-auth-pages1"></script>
</body>
</html>
